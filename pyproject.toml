[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end MLOps pipeline on AWS: train, gate, register, serve and monitor a churn model"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn==1.9.1",
  "joblib>=1.4",
  "boto3>=1.43.120",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "prometheus-client>=0.21", "pydantic>=2.9"]
train = ["mlflow==3.17.2"]
dev = ["churn[serve,train]", "pytest>=9.2.0", "pytest-cov>=5", "httpx>=0.27", "moto[s3,cloudwatch]>=5.2.5", "ruff>=0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=churn --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.coverage.report]
fail_under = 85
